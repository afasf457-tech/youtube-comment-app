<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141b2d"><title>유튜브 댓글 생성기</title><style>*{box-sizing:border-box}body{margin:0;background:#101522;color:#f5f7ff;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}.wrap{max-width:560px;margin:auto;padding:32px 20px 60px}h1{font-size:26px;margin:0 0 8px}p{color:#abb7ce;line-height:1.55}.panel{background:#1b2436;border:1px solid #334057;border-radius:20px;padding:20px;margin-top:22px}label{display:block;font-weight:700;margin:17px 0 9px}input,select,textarea{width:100%;font:inherit;border:1px solid #4b5870;border-radius:12px;background:#101827;color:#fff;padding:15px;outline:none}input:focus,textarea:focus{border-color:#8ea9ff}button{border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer}button.primary{width:100%;background:#8aa7ff;color:#111a30;margin-top:20px}button.secondary{background:#303d55;color:#fff}.help{font-size:12px;color:#a8b6d0;line-height:1.6}.result{white-space:pre-wrap;font-size:18px;line-height:1.65;min-height:85px}.row{display:flex;gap:10px;margin-top:12px}.row button{flex:1}.status{font-size:13px;min-height:22px;color:#c5d5fa;margin-top:14px}a{color:#a9beff}small{color:#91a1bd}</style></head><body><main class="wrap"><h1>🎬 유튜브 댓글 생성기</h1><p>영상 링크 하나로 내용을 분석하고 자연스러운 댓글을 만듭니다.</p><div class="panel"><label for="key">① Gemini API 키</label><input id="key" type="password" placeholder="AIza..." autocomplete="off" autocapitalize="off"><div class="help">API 키는 이 브라우저에 저장되어 다음 방문 시 자동 입력됩니다. 공유 기기에서는 사용하지 마세요. 브라우저 데이터를 삭제하면 키도 삭제됩니다. <a href="https://aistudio.google.com/api-keys" target="_blank" rel="noopener">API 키 발급</a></div><label for="url">② 유튜브 링크</label><input id="url" type="url" placeholder="https://youtu.be/..." autocapitalize="off"><label for="style">③ 댓글 스타일</label><select id="style"><option value="담백한 혼잣말처럼, 자연스럽고 구체적으로">담백하고 자연스럽게 (추천)</option><option value="가벼운 위트를 섞되 억지스럽지 않게">살짝 재치 있게</option><option value="차분하고 진솔하게">차분하게</option></select><button id="go" class="primary">✨ 영상 분석하고 댓글 만들기</button><div class="status" id="status" role="status"></div></div><div class="panel"><strong>완성된 댓글</strong><div class="result" id="result" style="margin-top:15px;color:#dce5ff">아직 생성된 댓글이 없어요.</div><div class="row"><button id="copy" class="secondary">📋 댓글 복사</button><button id="again" class="secondary">↻ 다시 생성</button></div></div><p class="help">공개 유튜브 영상만 분석 가능합니다. Gemini API 무료 사용량, 모델 및 영상 접근 제한에 따라 실패할 수 있습니다. 영상 내용을 확인하지 못하면 댓글을 지어내지 않도록 설정했습니다. 생성된 댓글은 게시 전에 직접 확인하세요.</p></main><script>
const $=id=>document.getElementById(id);
try { $('key').value=localStorage.getItem('gemini_api_key')||''; } catch(e) {}
$('key').addEventListener('input',()=>{try{localStorage.setItem('gemini_api_key',$('key').value.trim())}catch(e){}});
let last='';const status=s=>$('status').textContent=s;
async function generate(){const key=$('key').value.trim(),url=$('url').value.trim();if(!key)return status('API 키를 입력해 주세요.');if(!/^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(url))return status('올바른 유튜브 링크를 입력해 주세요.');$('go').disabled=true;status('Gemini가 영상을 분석하고 있어요. 잠시 기다려 주세요…');$('result').textContent='분석 중…';try{const prompt=`이 공개 유튜브 영상을 실제로 분석한 다음 한국어 댓글을 단 하나만 작성해. 실제 영상에서 확인한 구체적인 내용 한 가지를 반영해. 35~55자 내외. ${$('style').value}. 과한 칭찬, 광고 문구, 알바 티, 해시태그, 따옴표, 설명을 빼고 댓글 본문만 출력해. 영상 접근이나 분석이 불가능하면 댓글을 지어내지 말고 정확히 '영상 분석 불가'라고 출력해.`;const payload={contents:[{role:'user',parts:[{text:prompt},{file_data:{mime_type:'video/mp4',file_uri:url}}]}],generationConfig:{temperature:.75,maxOutputTokens:220}};const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error((data.error&&data.error.message)||'API 요청 실패 ('+r.status+')');last=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();if(!last)throw Error('답변이 비어 있습니다.');$('result').textContent=last;status(last.includes('영상 분석 불가')?'영상에 접근할 수 없습니다. 다른 공개 영상을 시도하세요.':'댓글이 생성됐어요. 내용을 확인한 뒤 복사하세요.')}catch(e){$('result').textContent='댓글을 생성하지 못했어요.';status('오류: '+e.message+' · API 키, 무료 한도, 영상 공개 여부를 확인하세요.')}finally{$('go').disabled=false}}
$('go').addEventListener('click',generate);$('again').addEventListener('click',generate);$('copy').addEventListener('click',async()=>{if(!last||last==='영상 분석 불가')return status('복사할 댓글이 없어요.');try{await navigator.clipboard.writeText(last);status('댓글을 복사했어요.')}catch(e){const t=document.createElement('textarea');t.value=last;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();status(ok?'댓글을 복사했어요.':'복사가 안 되면 댓글을 길게 눌러 복사하세요.')}});
</script></body></html>
